[project]
name = "mcp-env-mux"
version = "0.1.0"
description = "Merge multiple instances of the same MCP server across environments into a single endpoint with a unified env parameter."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
]

[project.scripts]
mcp-env-mux = "mcp_env_mux.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.2",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]
