[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-env-mux"
version = "0.3.7"
description = "Merge multiple instances of the same MCP server across environments into a single endpoint with a unified env parameter."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Anurag Rao", email = "raoanu2004@gmail.com" },
]
keywords = ["mcp", "proxy", "environment", "multiplexer", "ai", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp==3.2.4",
    "cryptography==48.0.0",
    "PyJWT[crypto]==2.12.1",
    "prometheus-client==0.25.0",
    "py-key-value-aio[redis]==0.4.4",
]

[project.scripts]
mcp-env-mux = "mcp_env_mux.cli:main"

[project.urls]
Homepage = "https://github.com/anuragrao04/mcp-mux"
Repository = "https://github.com/anuragrao04/mcp-mux"
Issues = "https://github.com/anuragrao04/mcp-mux/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.2",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_env_mux"]
